# Phase 6B · 正式生产制品身份标记。
# 本文件只存在于 sw-bootstrap/src/prod/resources/ 下，仅当以 `-Pprod` 构建时才被加入
# classpath（见 sw-bootstrap/pom.xml 的 prod profile resources）。因此该标记在制品中的
# 存在性即可机器判定「本 Boot Jar 由正式生产构建入口生成」，dev/local 构建的 jar 不含它。
#
# Phase 6C · build.version 由 Maven 资源过滤在打包期解析为 ${project.version}
# （即 CI-friendly revision 的有效值，如 -Drevision=0.1.2 时为 0.1.2），与 Release
# 标题/上传制品名/CI effective version 同源；制品门禁 scripts/check-prod-artifact.sh
# 会校验其已解析且与期望版本一致。
build.profile=prod
build.entry=scripts/build-prod.sh
build.gate=scripts/check-prod-artifact.sh
build.version=${project.version}
