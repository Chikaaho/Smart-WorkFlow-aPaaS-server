# ===================================================================
# Smart-WorkFlow 开发环境配置
# ===================================================================
ch:
  dev:
    test-mock: true

server:
  port: 8080

# I5 收口：Druid 监控台仅在 dev profile 显式开启（默认全局关闭）；
# 开发文档入口仅 dev profile 开放（默认全局关闭）。
# 注意：本文件 spring 顶层键只出现一次——SnakeYAML 对重复顶层键 fail-fast。
spring:
  druid:
    stat-view-servlet:
      enabled: true
      url-pattern: /druid/*
      login-username: ${DRUID_USERNAME:dev-admin}
      login-password: ${DRUID_PASSWORD:dev-admin-only-local}

  autoconfigure:
    exclude:
      # pgvector 需 PostgreSQL 且需单一 EmbeddingModel，dev 的 H2 + 双 AI 模型冲突，排除
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  datasource:
    dynamic:
      druid:
        initial-size: 2
        min-idle: 1
        max-active: 5
      datasource:
        master:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:mem:smart_workflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          username: sa
          password:
        # 扩展库示例：IoT 独立 H2 内存库
        # iot:
        #   driver-class-name: org.h2.Driver
        #   url: jdbc:h2:mem:smart_workflow_iot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        #   username: sa
        #   password:

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:1}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-your-openai-api-key}
    ollama:
      base-url: http://localhost:11434

  flyway:
    locations:
      - classpath:db/migration/{vendor}
      - classpath:db/migration/bpm/{vendor}
      - classpath:db/migration/notify/{vendor}
      - classpath:db/migration/form/{vendor}
      - classpath:db/migration/storage/{vendor}
      - classpath:db/migration/job/{vendor}
      - classpath:db/migration/agent/{vendor}
      - classpath:db/migration/iot/{vendor}
      - classpath:db/migration/openapi/{vendor}
      - classpath:db/migration/system/{vendor}
      # I5 复验：dev 专用可控测试身份夹具（仅 dev profile）
      - classpath:db/migration/devseed/{vendor}

  flowable:
    database-schema-update: false

  mqtt:
    broker:
      username: ${MQTT_USERNAME:dev}
      password: ${MQTT_PASSWORD:dev}

logging:
  level:
    root: info
    com.sw.ck: debug
    org.springframework.jdbc: debug
    com.baomidou.mybatisplus: debug

# 开发文档入口仅 dev profile 开放（默认全局关闭）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ======================== 外部数据源（dev 用 H2 测试密钥） ========================
sw:
  storage:
    active-provider: local
    providers:
      local:
        base-path: ./uploads
        url-prefix: /files
      minio:
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
  job:
    enabled: true
  bpm:
    enabled: true
  form:
    enabled: true
  external-datasource:
    cipher-key: "c21hcnQtd29ya2Zsb3ctZGV2LWNpcGhlci1rZXkhIQ=="
  security:
    debug-auth:
      # 本地调试需显式设置 SW_DEBUG_AUTH_ENABLED=true；不设置则保持关闭。
      enabled: ${SW_DEBUG_AUTH_ENABLED:false}
  iot:
    enabled: true
    cipher:
      cipher-key: "c21hcnQtd29ya2Zsb3ctZGV2LWNpcGhlci1rZXkhIQ=="
    tencent:
      enabled: false
      provider-mode: mock
      region: ${TENCENT_CLOUD_REGION:ap-guangzhou}
      endpoint: iotexplorer.tencentcloudapi.com
      secret-id: ${TENCENT_CLOUD_SECRET_ID:}
      secret-key: ${TENCENT_CLOUD_SECRET_KEY:}
      queue-expiry-minutes: 1440
      max-retry-count: 3
