# ===================================================================
# Smart-WorkFlow 开发环境配置
# ===================================================================
server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      # pgvector 需 PostgreSQL 且需单一 EmbeddingModel，dev 的 H2 + 双 AI 模型冲突，排除
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  datasource:
    dynamic:
      druid:
        initial-size: 2
        min-idle: 1
        max-active: 5
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://127.0.0.1:5432/smart_workflow
          username: ${PG_USERNAME:}
          password: ${PG_PASSWORD:}
        # 扩展库示例：IoT 独立 H2 内存库
        # iot:
        #   driver-class-name: org.h2.Driver
        #   url: jdbc:h2:mem:smart_workflow_iot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        #   username: sa
        #   password:

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-your-openai-api-key}
    ollama:
      base-url: http://localhost:11434

  flowable:
    database-schema-update: false

  mqtt:
    broker:
      username: ${MQTT_USERNAME:dev}
      password: ${MQTT_PASSWORD:dev}

logging:
  level:
    root: info
    com.sw.ck: debug
    org.springframework.jdbc: debug
    com.baomidou.mybatisplus: debug

# ======================== 外部数据源（dev 用 H2 测试密钥） ========================
sw:
  storage:
    active-provider: minio
    providers:
      local:
        base-path: ./uploads
        url-prefix: /files
      minio:
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bpm:
    enabled: true
  form:
    enabled: true
  external-datasource:
    cipher-key: "c21hcnQtd29ya2Zsb3ctZGV2LWNpcGhlci1rZXkhIQ=="
  iot:
    enabled: true
    cipher:
      cipher-key: "c21hcnQtd29ya2Zsb3ctZGV2LWNpcGhlci1rZXkhIQ=="
    tencent:
      enabled: false
      provider-mode: mock
