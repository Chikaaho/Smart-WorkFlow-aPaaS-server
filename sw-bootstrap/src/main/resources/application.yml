# ===================================================================
# Smart-WorkFlow 主配置文件
# ===================================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    # ======================== 文件上传（P32 导入） ========================
    # multipart 层上限略高于业务上限（FormImportExportService.MAX_IMPORT_FILE_BYTES = 5MB），
    # 使业务层能以结构化错误（1499）拒绝超限文件；超过 6MB 由容器层直接拒绝。
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

    name: smart-workflow

  profiles:
    active: local

  # ======================== 多数据源（dynamic-datasource，主库 = master） ========================
  datasource:
    dynamic:
      primary: master
      # FLyway 只跑主库；动态数据源自带的 Flyway 集成关闭，统一由 FlywayConfiguration 管控
      flyway:
        enabled: false
      # Druid 连接池全局配置
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://localhost:5432/smart_workflow
          username: ${DATASOURCE_USERNAME:postgres}
          password: ${DATASOURCE_PASSWORD:123456}
        # 扩展库示例（按需取消注释并补齐连接信息）：
        # iot:
        #   driver-class-name: org.postgresql.Driver
        #   url: jdbc:postgresql://localhost:5432/smart_workflow_iot
        #   username: ${DATASOURCE_USERNAME:postgres}
        #   password: ${DATASOURCE_PASSWORD:}

  # ======================== Druid 监控页面 ========================
  druid:
    stat-view-servlet:
      # I5 收口：监控台默认关闭（仅 dev/local profile 显式开启）；凭据不再提供仓库默认值，
      # 开启时必须经环境变量注入，缺失/占位即无可用凭据
      enabled: false
      url-pattern: /druid/*
      login-username: ${DRUID_USERNAME:}
      login-password: ${DRUID_PASSWORD:}

  # ======================== Flyway（主迁移，绑定主数据源） ========================
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/{vendor}
      - classpath:db/migration/bpm/{vendor}
      - classpath:db/migration/notify/{vendor}
      - classpath:db/migration/form/{vendor}
      - classpath:db/migration/storage/{vendor}
      - classpath:db/migration/job/{vendor}
      - classpath:db/migration/agent/{vendor}
      - classpath:db/migration/iot/{vendor}
      - classpath:db/migration/openapi/{vendor}
      - classpath:db/migration/system/{vendor}
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history

  # ======================== Redis ========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 5000

  # ======================== Flowable ========================
  flowable:
    async-executor-activate: false
    database-schema-update: true

  # ======================== Spring AI ========================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3

  # ======================== MQTT ========================
  mqtt:
    broker:
      url: tcp://localhost:1883
      client-id: smart-workflow-client
      username: ${MQTT_USERNAME:}
      password: ${MQTT_PASSWORD:}

sw:
  # ---------- 文件存储 ----------
  storage:
    enabled: true
    active-provider: minio
    providers:
      local:
        base-path: ./uploads
        url-prefix: /files
      minio:
        url: http://localhost:9000
        access-key: ${MINIO_ACCESS_KEY:}
        secret-key: ${MINIO_SECRET_KEY:}
        bucket: smart-workflow
      cos:
        secret-id: ${COS_SECRET_ID:}
        secret-key: ${COS_SECRET_KEY:}
        region: ap-guangzhou
        bucket: ${COS_BUCKET:}
      qiniu:
        access-key: ${QINIU_ACCESS_KEY:}
        secret-key: ${QINIU_SECRET_KEY:}
        bucket: ${QINIU_BUCKET:}
        domain: ${QINIU_DOMAIN:}
  # ---------- 定时任务 ----------
  job:
    enabled: true
    pool-size: 10
    log-retention-days: 30

  # ---------- AI 智能体（大模型接入配置管理） ----------
  agent:
    enabled: true
    cipher-key: ${SW_CIPHER_KEY:}                                        # AES-256-GCM 密钥（Base64），与 sw.external-datasource.cipher-key 同构共享

  # ---------- 站内信 / 消息模板（M05，P36 消息模板管理） ----------
  notify:
    enabled: true

  # ---------- 多租户（列级隔离） ----------
  tenant:
    ignore-tables:
      - sys_menu                           # sys_menu 为全局表，无 tenant_id 列，需排除租户拦截器

  # ---------- 外部数据源执行引擎 ----------
  external-datasource:
    cipher-key: ${SW_CIPHER_KEY:}                                        # AES-256-GCM 密钥（Base64），pro 从环境变量注入
    pool:
      max-pool-size: 5
      min-idle: 0
      idle-timeout: 600000                                              # 10 min
      max-lifetime: 1800000                                             # 30 min
      connection-timeout: 10000                                         # 10 sec
    execution:
      max-rows: 1000
      query-timeout: 30                                                 # 秒

  # ---------- 安全 / JWT ----------
  security:
    token-header: Authorization
    token-prefix: "Bearer "
    permit-urls:
      - /auth/challenge
      - /auth/login
      - /auth/refresh
      - /auth/logout
      - /auth/sso/*/callback
      - /auth/sso/ticket
      - /auth/sso/candidate
      - /openapi/v1/**
      # I5 收口：仅放行无详情的最小健康探针（liveness/readiness），详细健康、
      # 指标、环境与管理入口一律需要认证；swagger 调试入口不再随生产开放
      - /actuator/health
      - /actuator/health/liveness
      - /actuator/health/readiness
    debug-auth:
      # 仅 dev/test + 回环 + 显式开关同时成立时才会生效，默认关闭。
      enabled: ${SW_DEBUG_AUTH_ENABLED:false}
    cookie:
      secure: false
      # 浏览器可见 refresh cookie Path：必须覆盖公开 refresh/logout URL 的最小前缀。
      # 生产同源保前缀部署（/sw-server/api）在 application-prod.yml 覆盖，避免
      # Cookie Path 与请求路径不匹配导致有效 refresh 凭证被误判无效（P45 第一断点）。
      path: /api/auth/
    login:
      challenge-ttl-seconds: 300
      captcha-fail-limit: 5
      client-time-tolerance-millis: 180000
      captcha-length: 4
      rsa-key-version: ${SW_LOGIN_RSA_KEY_VERSION:v1}
      # 私钥只允许外部安全配置注入（PKCS#8 PEM）；未注入时启动期 fail-fast，无默认私钥
      rsa-private-key: ${SW_LOGIN_RSA_PRIVATE_KEY:}
      # 验证码答案 HMAC 摘要密钥：Redis 只存 HMAC，泄露不可枚举恢复答案
      digest-secret: ${SW_LOGIN_DIGEST_SECRET:}
      # 轮换窗口内的旧版本私钥，可选；生产经密钥设施注入
      rsa-extra-keys: {}
    # I5：SSO Provider 凭据 AES-256-GCM 加密密钥（Base64）；缺失/空白时启动失败
    sso:
      cipher-key: ${SW_SSO_CIPHER_KEY:}
    jwt:
      secret: ${JWT_SECRET:smart-workflow-jwt-secret-CHANGE-ME-IN-PRODUCTION-please}
      expire-seconds: 7200
      access-expire-seconds: 900
      refresh-expire-seconds: 604800

# ======================== MyBatis-Plus ========================
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.sw.ck.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ======================== 日志 ========================
logging:
  level:
    root: info
    com.sw.ck: debug

# ======================== Actuator ========================
# I5 收口：默认最小暴露（仅 health，不带详情）；开发/运维需要更多端点时在
# 对应 profile 显式覆盖，且 /actuator/** 不再进入认证白名单（见 sw.security.permit-urls）
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

# ======================== SpringDoc ========================
# I5 收口：开发文档与调试入口默认关闭，不随生产 profile 自动开放；
# dev/local profile 需要时显式覆盖 springdoc.api-docs.enabled=true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  api-docs-path: /v3/api-docs
