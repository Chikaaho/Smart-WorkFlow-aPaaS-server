# P61 user message catalog · English (en-US)
# Key rule: error.<errorKey>; see docs/governance/error-code-catalog.md
# errorKeys missing here fall back to the enum's zh-CN default text.

error.common.system_error=The system is temporarily unable to process this request. Please try again later; if it persists, contact your administrator with the event reference.
error.common.param_error=Some request parameters are invalid. Please check and try again.
error.common.unauthenticated=Your session has expired. Please sign in again.
error.common.forbidden=You do not have permission to perform this action. Please ask an administrator for access.
error.common.not_found=The requested item does not exist or has been deleted. Please go back to the list and refresh.
