name: Build & Release (main)

on:
  push:
    # 测试验证在 feature/develop 上触发即可（不再为跑测试推 main）；正式 Release 制品
    # 仅由 main 推送创建（见下方 Create GitHub Release 的 ref 门控）。
    branches: [main, develop, 'feature/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 登录挑战链（P45/I5）与通知工作台用例（I6）在测试期真实读写 Redis；
    # runner 镜像默认不提供该服务，缺失时相关 Boot 用例必然失败。
    # PostgreSQL 服务容器（0.2.2 整版发布新增）：应用中心恢复演练
    # ApplicationCenterRecoveryDrillPostgresTest 需要真实 PG（pg_dump/pg_restore + JDBC），
    # 方向 direction-022-close-release 第 4 阶段要求该测试在 CI 实际跑通（不得跳过）。
    # 端口用 55432 而非 5432：H7TenantIsolationIntegrationTest 以裸 socket 探测
    # localhost:5432 判定「本机常驻在役库」存在与否（在役库语义=全量 schema），
    # 5432 上出现空容器会令其误判后失败；演练测试走 AC_G4_PG_URL 与端口解耦。
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        # 镜像版本对齐 runner 预装的客户端（pg_dump/pg_restore 18.x）：跨版本 dump→restore
        # （如 18 转储恢复进 14 服务）会因新 GUC（transaction_timeout 等）失败，属工具链配对问题。
        image: postgres:18
        env:
          POSTGRES_USER: runner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 恢复演练测试经 AC_G4_PG_URL 取完整 JDBC URL（测试侧不再拼接前缀；
      # 连接用户取 runner osUser，trust 免密；db 由测试自建 ac_g4_recovery_drill）
      AC_G4_PG_URL: jdbc:postgresql://127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Phase 6C · CI-friendly 版本身份：开发默认 effective version 必须经 Maven 求值
      # （禁止 XML grep 得到字面 ${revision}），并断言为 0.4.1-SNAPSHOT；正式值 0.4.1
      # 由该有效值剥掉 -SNAPSHOT 解析而来，随后以 -Drevision=0.4.1 驱动唯一生产构建入口
      # （测试、打包与制品门禁同版本），Release 标题与上传制品名取自同一版本变量。
      - name: Resolve CI-friendly version (Maven effective)
        id: version
        run: |
          set -euo pipefail
          DEV_VERSION=$(mvn -B -q org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)
          if [ -z "${DEV_VERSION}" ] || [ "${DEV_VERSION}" = '${revision}' ]; then
            echo "::error::Maven effective version 为空或未解析: ${DEV_VERSION}"; exit 1
          fi
          if [ "${DEV_VERSION}" != '0.4.1-SNAPSHOT' ]; then
            echo "::error::develop 默认版本必须为 0.4.1-SNAPSHOT，实际 ${DEV_VERSION}"; exit 1
          fi
          RELEASE_VERSION="${DEV_VERSION%-SNAPSHOT}"
          if [ -z "${RELEASE_VERSION}" ] || [ "${RELEASE_VERSION}" = "${DEV_VERSION}" ] || [ "${RELEASE_VERSION}" = '${revision}' ]; then
            echo "::error::正式版本解析失败: dev=${DEV_VERSION} release=${RELEASE_VERSION}"; exit 1
          fi
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "开发 effective version = ${DEV_VERSION}；正式发布版本 = ${RELEASE_VERSION}"

      # Phase 6B/6C：发布必须走仓内唯一生产构建入口（先全量测试门禁 → prod profile 打包 →
      # 制品门禁），-Drevision 同版本贯穿测试/打包/门禁；门禁不通过则整个 workflow 失败，
      # 不会产出 Release。
      - name: "Production build (in-repo entry: tests + prod package + artifact gate)"
        run: REVISION="${{ steps.version.outputs.release_version }}" bash scripts/build-prod.sh

      # 恢复演练测试诊断（always）：surefire 报告 + XML 跳过消息 + 环境因子探测
      # （AC_G4_PG_URL 可见性 / psql 连通 / pg_dump·pg_restore 工具链），
      # 供 direction-022-close-release 第 4 阶段「CI 实跑」验收取证；只读，不影响门禁。
      - name: "Drill test diagnostics (always)"
        if: always()
        run: |
          F=sw-bootstrap/target/surefire-reports/com.sw.ck.bootstrap.ApplicationCenterRecoveryDrillPostgresTest.txt
          X=sw-bootstrap/target/surefire-reports/TEST-com.sw.ck.bootstrap.ApplicationCenterRecoveryDrillPostgresTest.xml
          if [ -f "${F}" ]; then cat "${F}"; else echo "::warning::drill surefire txt 缺失"; fi
          if [ -f "${X}" ]; then grep -oE '<skipped[^>]*' "${X}" | head -2; fi
          echo "AC_G4_PG_URL=[${AC_G4_PG_URL}]"
          echo "user.name=$(java -XshowSettings:properties -version 2>&1 | grep user.name | head -1)"
          which pg_dump pg_restore psql 2>&1
          pg_dump --version 2>&1 | head -1
          PGPASSWORD="" psql -w -h 127.0.0.1 -p 55432 -U runner -d postgres -c "select 1" 2>&1 | head -2
          DRIVER=$(find /home/runner/.m2/repository/org/postgresql -name "postgresql-42*.jar" ! -name "*sources*" 2>/dev/null | head -1)
          echo "driver=${DRIVER}"
          if [ -n "${DRIVER}" ]; then
            printf '%s\n' 'import java.sql.*;' 'public class Probe {' '  public static void main(String[] args) {' '    String url = System.getenv().getOrDefault("AC_G4_PG_URL", "jdbc:postgresql://127.0.0.1:55432/postgres");' '    if (!url.startsWith("jdbc:")) { url = "jdbc:postgresql://" + url; }' '    String osUser = System.getProperty("user.name", "postgres");' '    try (Connection c = DriverManager.getConnection(url, osUser, "")) {' '      System.out.println("JDBC_OK as " + osUser + " via " + url);' '    } catch (Exception e) {' '      System.out.println("JDBC_FAIL as " + osUser + " via " + url + " -> " + e);' '    }' '  }' '}' > /tmp/Probe.java
            java -Duser.name=runner -cp "${DRIVER}" /tmp/Probe.java 2>&1 | grep -E "JDBC_OK|JDBC_FAIL" | head -2
          fi
          echo "=== in-step drill rerun ==="
          MAVEN_OPTS="-Xmx2g" mvn -B -pl sw-bootstrap -am test -Dtest='ApplicationCenterRecoveryDrillPostgresTest' -Dsurefire.failIfNoSpecifiedTests=false -Dsurefire.useFile=false 2>&1 | grep -E "Tests run:|Running com.sw.ck.bootstrap.Application|skipped message" | head -8

      - name: Locate executable JAR
        id: locate
        run: |
          JAR="sw-bootstrap/target/bootstrap.jar"
          test -f "${JAR}" || { echo "::error::未找到正式生产制品 ${JAR}"; exit 1; }
          # 版本唯一来源：生产制品身份标记中的 build.version（打包期由 Maven 过滤解析），
          # 必须与本 workflow 已验证的正式发布版本一致，否则拒绝发布。
          MARKER_VERSION=$(unzip -p "${JAR}" META-INF/production-build.properties | sed -n 's/^build\.version=//p' | head -n 1)
          if [ -z "${MARKER_VERSION}" ] || [ "${MARKER_VERSION}" != '${{ steps.version.outputs.release_version }}' ]; then
            echo "::error::制品版本标记 ${MARKER_VERSION:-<空>} 与发布版本 ${{ steps.version.outputs.release_version }} 不一致"; exit 1
          fi
          ASSET_NAME="bootstrap-${{ steps.version.outputs.release_version }}.jar"
          # 版本化命名直接落盘副本（gh 的 file#label 标签语法在 runner 上不生效，
          # 曾导致资产退化为 bootstrap.jar；以实体文件名承载版本，命名唯一来源不变）。
          cp "${JAR}" "${ASSET_NAME}"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.version.outputs.release_version }}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${JAR}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # 分支触发只做测试/制品构建验证；tag+Release 制品仅由 main 发布。
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_SHA}"
          # 固定发布目标：tag 与本次构建提交（完整 SHA）绑定，main 后续推进不改变目标。
          # 查询既有 tag 目标（仅 fetch 引用，不创建）。查询失败（网络/远端异常）必须
          # 停止发布——不得把查询失败当作无 tag 继续，避免在未知状态下删除/重建 Release。
          EXISTING_TAG_TARGET=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')
          if [ -n "${EXISTING_TAG_TARGET}" ] && [ "${EXISTING_TAG_TARGET}" != "${GITHUB_SHA}" ]; then
            echo "::error::tag ${TAG} 已指向其他提交 ${EXISTING_TAG_TARGET}，拒绝覆盖其他提交的发行物"
            exit 1
          fi
          # 同提交重跑：仅删除既有 Release（保留 tag），随后重建；不删除其他 tag/Release。
          gh release view "${TAG}" >/dev/null 2>&1 && gh release delete "${TAG}" --yes || true
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --latest=false \
            --title "CH-aPaaS-Server ${{ steps.version.outputs.release_version }} build ${GITHUB_SHA}" \
            --notes "自动构建产物（提交 ${GITHUB_SHA}，分支 main，版本 ${{ steps.version.outputs.release_version }}）" \
            "${{ steps.locate.outputs.asset }}"

      # 失败诊断：把各模块 surefire 的失败摘要以 ::error:: 注解输出。
      # 目的=发布门禁失败时可从 check-run 注解（无需仓库管理员权限）直接读到失败测试类与计数，
      # 不必依赖需要鉴权的 Actions 日志下载。本步骤只读报告、不改判定（作业已因上游步骤失败而失败）。
      - name: "Report failing tests as annotations (diagnostics)"
        if: failure()
        run: |
          set +e
          find . -path '*/target/surefire-reports/*.txt' -print0 2>/dev/null \
            | xargs -0 grep -h -E 'Tests run: [0-9]+, Failures: [1-9]|Tests run: [0-9]+, Failures: [0-9]+, Errors: [1-9]' 2>/dev/null \
            | head -20 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          exit 0